# Cloud Linux host only. Secrets: /etc/velora/r2-worker.env and bot-api.env,
# both mode 0600. These files are never copied into either image.
name: velora-r2-uploads
services:
  init-volumes:
    image: velora/r2-worker:local
    build:
      context: ../..
      dockerfile: infra/uploads/Dockerfile
    user: "0:0"
    command: ["node", "-e", "const fs=require('node:fs'); for(const p of ['/media/uploads','/var/lib/velora-upload-journal']) { fs.chownSync(p,10001,10001); fs.chmodSync(p,0o700); }"]
    volumes:
      - media:/media/uploads
      - journal:/var/lib/velora-upload-journal
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    read_only: true
  telegram-bot-api:
    build:
      context: ../telegram-bot-api
    image: velora/telegram-bot-api:10.3-2efabc722e94
    env_file: /etc/velora/bot-api.env
    command: ["--local", "--dir=/var/lib/telegram-bot-api", "--temp-dir=/tmp/telegram-bot-api", "--http-port=8081"]
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - bot-state:/var/lib/telegram-bot-api
      - media:/media/uploads:ro
    tmpfs:
      - /tmp/telegram-bot-api:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 1.0
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
  worker:
    image: velora/r2-worker:local
    # Shared network namespace lets the existing adapter use HTTP loopback;
    # no Bot API port is published and no token traverses a public network.
    network_mode: service:telegram-bot-api
    env_file: /etc/velora/r2-worker.env
    environment:
      VELORA_UPLOAD_STAGING_DIR: /media/uploads
      VELORA_UPLOAD_JOURNAL_DIR: /var/lib/velora-upload-journal
      TELEGRAM_BOT_API_URL: http://127.0.0.1:8081
      TELEGRAM_BOT_API_PATH_MAP: ""
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_healthy
    volumes:
      - media:/media/uploads
      - journal:/var/lib/velora-upload-journal
    restart: unless-stopped
    stop_grace_period: 6h10m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8792/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
volumes:
  media:
  journal:
  bot-state:
